[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "editor-cache-cleanup"
version = "0.1.0"
description = "Preview-first cache cleanup for VS Code and Cursor on Windows, macOS and Linux"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Environment :: Console",
]

[project.scripts]
editor-cleanup = "editor_cleanup:main"

[tool.setuptools]
py-modules = ["editor_cleanup"]
